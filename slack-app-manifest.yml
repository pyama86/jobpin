display_information:
  name: jobpin
  description: GitHub Actions のジョブ完了・失敗を通知する bot
  background_color: "#24292e"
features:
  bot_user:
    display_name: jobpin
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
